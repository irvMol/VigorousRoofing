services:
  eleventy:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - site_output:/app/_site    # write built site here
      - eleventy_cache:/app/.cache      # persistent cache volume
    working_dir: /app
    networks:
      - web

  caddy:
    image: caddy:latest
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - site_output:/srv/vigorous/_site    # read from same named volume
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    networks:
      - web

  oauth:
    build:
      context: ./oauth
      dockerfile: Dockerfile.oauth
    environment:
      NODE_ENV: production
      ORIGIN: https://vigorousroofing.com
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    networks:
      - web

networks:
  web:

volumes:
  node_modules:
  caddy_data:
  caddy_config:
  site_output:
  eleventy_cache:
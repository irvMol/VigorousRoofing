services:
  eleventy:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - site_output:/app/_site    # write built site here
    working_dir: /app
    networks:
      - web

  caddy:
    image: caddy:latest
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - site_output:/srv/vigorous/_site    # read from same named volume
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  site_output:
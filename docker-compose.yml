services:
  eleventy-dev:
    build:
      context: ./eleventy
      dockerfile: Dockerfile
    volumes:
      - ./eleventy:/app
    working_dir: /app
    # SIMPLIFIED COMMAND:
    command: sh -c "npm run build:css && npx @11ty/eleventy --serve"
    ports:
      - "80:8080"
    networks:
      - web

networks:
  web:
    driver: bridge
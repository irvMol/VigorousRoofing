name: Deploy

on:
  push:
    branches:
      - main # Only deploy when pushing to main (optional but safer)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1

      - name: Copy project files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: ${{ secrets.PORT }}
          source: '.' # Adjust if you want to exclude .git or workflows
          target: '/srv/vigorous'
          # rm: true  # Optional: clean target before copying

      - name: Run Docker Compose on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /srv/vigorous
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --build
